<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Paris Bites · Inventory Management</title>
    <base href="/" />
    <!--
      viewport-fit=cover lets the layout reach under a notch and the home indicator, which is
      what makes an installed POS look native rather than letterboxed. The panels that sit at
      the bottom edge pay for it back with env(safe-area-inset-bottom) padding.

      No maximum-scale or user-scalable=no: pinch-zoom is the accessibility escape hatch for
      anyone who needs the total bigger than the design makes it, and disabling it to stop
      double-tap zoom would be trading their reading for our polish.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Inventory management for Paris Bites." />
    <meta name="color-scheme" content="light dark" />
    <!-- Set by ThemeService before first paint; this is the pre-hydration default. -->
    <meta name="theme-color" content="#ffffff" />

    <!--
      The tab icon: the logo's Eiffel tower. Two files on purpose.

      The SVG is the one browsers should use — it stays crisp on a retina tab and at whatever size
      a bookmark bar or history entry asks for. Safari only gained SVG favicon support recently, and
      some tooling reads neither, so `favicon.ico` stays as the fallback and is listed *second*:
      browsers take the last usable declaration, so the order is what makes the SVG win where it is
      supported.

      The .ico carries 16/32/48 frames, and its 16px frame is drawn from `favicon-16.svg` — the same
      tower with the upper platform removed, because four horizontal features do not fit in sixteen
      pixels of height. See the comment in that file.
    -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="brand/favicon.svg" />

    <!--
      Progressive web app.

      The manifest is what makes "Install to Home Screen" offered at all, and display:standalone
      is what drops the browser chrome once it is. iOS reads none of the manifest for the status
      bar, so the apple-* tags below are not duplicates — without them an installed icon on
      iPhone launches in Safari with a visible address bar.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Paris Bites" />
    <!-- black-translucent so the page paints under the status bar, matching viewport-fit=cover. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!--
      Fonts. preconnect shaves a round trip off the TLS handshake.

      Inter is the interface face for the whole app. Playfair Display and Poppins are
      the *brand* faces, matching the customer-facing site, and are used only by the
      sign-in page — see `auth-theme.css`. They ride along in the same request because
      a second Google Fonts stylesheet would cost another round trip, while the font
      binaries themselves are only fetched if something on screen actually uses them.

      Note the two different `display` strategies, which are not interchangeable:

      - Text faces use `swap` — body text should appear immediately in a fallback face
        rather than leaving the page blank while the webfont downloads.

      - Material Symbols uses `block` — icons are LIGATURES, so `swap` renders the
        ligature source text ("search", "menu", "more_vert") in the fallback font
        until the webfont arrives. Words scattered where icons belong is far worse
        than a brief blank space, and it is what users on a slow connection or behind
        a proxy that blocks Google Fonts would otherwise see.

      To drop the third-party dependency altogether, self-host these under
      public/fonts and replace these links with @font-face rules. Worth doing if
      Google Fonts is unacceptable for privacy reasons or the app must work offline.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <!--
      Start-up screen.

      Inlined here, not in a component, because it has to be on screen during the window when no
      component can be: the bundle is still downloading, and after that `provideAppInitializer`
      blocks the first render until the session has been restored. That initializer makes an API
      call, so on a cold API the blank page lasts as long as the API takes to answer — and the API
      sleeps after fifteen idle minutes, which is most mornings.

      The escalating lines are pure CSS `animation-delay`, with no script: the point is to work
      before any JavaScript of ours has run, and a plain stylesheet cannot be blocked by a future
      content-security-policy the way an inline script can.

      Colours are literals rather than design-system tokens for the same reason — the stylesheet
      that defines those tokens is one of the things still loading. They are the same values, and
      `prefers-color-scheme` is the only theme signal available before `ThemeService` runs.

      Angular removes everything inside <pb-root> when it renders, so there is nothing to tear
      down and no way for this to outlive the boot.
    -->
    <style>
      .pb-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 1.5rem;
        text-align: center;
        font-family: Poppins, Inter, system-ui, -apple-system, sans-serif;
        background-color: #fdf2f4;
        background-image: radial-gradient(115% 85% at 8% 0%, #faf8f5 0%, transparent 58%);
        color: #4a4a4a;
      }

      .pb-boot__logo {
        width: min(15rem, 66vw);
        height: auto;
      }

      .pb-boot__spinner {
        width: 1.75rem;
        height: 1.75rem;
        border: 2px solid rgb(212 165 116 / 0.35);
        border-top-color: #b8894a;
        border-radius: 50%;
        animation: pb-boot-spin 0.8s linear infinite;
      }

      /* Each line fades in only if boot is still going when its delay elapses. */
      .pb-boot__note {
        margin: 0;
        max-width: 22rem;
        font-size: 0.875rem;
        line-height: 1.5;
        opacity: 0;
        animation: pb-boot-fade 0.4s ease forwards;
      }

      .pb-boot__note--slow {
        animation-delay: 4s;
      }

      .pb-boot__note--cold {
        font-size: 0.8125rem;
        color: #78634e;
        animation-delay: 12s;
      }

      @keyframes pb-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pb-boot-fade {
        to {
          opacity: 1;
        }
      }

      /* A spinner that cannot spin still has to say something, so only motion is dropped. */
      @media (prefers-reduced-motion: reduce) {
        .pb-boot__spinner {
          animation: none;
          border-top-color: #b8894a;
        }

        .pb-boot__note {
          animation-duration: 0.01ms;
        }
      }

      @media (prefers-color-scheme: dark) {
        .pb-boot {
          background-color: #1a1411;
          background-image: radial-gradient(115% 85% at 8% 0%, #2c2119 0%, transparent 58%);
          color: #ded9d4;
        }

        .pb-boot__note--cold {
          color: #d9b98f;
        }
      }
    </style>
  </head>

  <body>
    <pb-root>
      <div class="pb-boot" role="status" aria-live="polite">
        <img
          class="pb-boot__logo"
          src="brand/paris-bites-logo.webp"
          alt="Paris Bites"
          width="720"
          height="469"
        />
        <div class="pb-boot__spinner" aria-hidden="true"></div>
        <p class="pb-boot__note pb-boot__note--slow">Starting up…</p>
        <p class="pb-boot__note pb-boot__note--cold">
          The server sleeps when it has not been used for a while. Waking it can take up to a
          minute — this only happens on the first visit of the day.
        </p>
      </div>
    </pb-root>
  </body>
</html>
